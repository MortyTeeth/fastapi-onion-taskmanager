[tool.poetry]
name = "fastapi-onion-architecture"
version = "1.0.0"
description = "Task Tracker API with Onion Architecture"
authors = ["Andrew <you@example.com>"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
sqlalchemy = {version = "^2.0", extras = ["asyncio"]}
asyncpg = "^0.29.0"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
alembic = "^1.13.2"
loguru = "^0.7.2"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = {version = "4.0.1", allow-prereleases = true}
aio-pika = "^9.4.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.23.8"
httpx = "^0.27.2"
pytest-dotenv = "^0.5.2"
alembic = "^1.17.2"
aiosqlite = "^0.21.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
env_files = [
    ".test.env",
    ".env"
]
addopts = "-ra -q"
testpaths = ["tests"]
python_paths = ["src"]
markers = [
    "integration: integration tests",
    "unit: unit tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:The 'app' shortcut is now deprecated"
]