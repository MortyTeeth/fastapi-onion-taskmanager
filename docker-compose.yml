services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 10

  task-db:
    image: postgres:16-alpine
    container_name: task-db
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - task_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  task-service:
    build: ./task_service
    container_name: task-service
    ports:
      - "8002:8000"
    env_file:
      - ./task_service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      task-db:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build: ./auth_service
    container_name: auth-service
    ports:
      - "8001:8000"
    env_file:
      - ./auth_service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  email-service:
    build: ./email_service
    container_name: email-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  task_db_data:
  auth_db_data: